<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Document</title>
    <link href="https://fonts.cdnfonts.com/css/handwriting" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script src="https://d3js.org/d3.v7.min.js" charset="utf-8"></script>
    <script src="https://d3js.org/d3-selection-multi.v1.min.js"></script>
    <script src="data.js"></script>
    <script type="module" src="app.js"></script>
    <button id="btn-reload-app" onclick="reloadApp()" 
  style="position:fixed;top:10px;right:10px;z-index:9999;padding:8px 12px;cursor:pointer">
  🔄 Reload app.js
</button>

<button onclick="reloadApp()" 
  style="position:fixed;top:10px;right:10px;z-index:9999;padding:8px 12px;cursor:pointer">
  🔄 Reload app.js
</button>

<script>
function reloadApp() {
  const old = document.getElementById('app-module');
  if (old) old.remove();

  const s = document.createElement('script');
  s.type = 'module';
  s.src = 'app.js?v=' + Date.now();
  s.id = 'app-module';
  document.head.appendChild(s);
}
</script>
  </body>
</html>
